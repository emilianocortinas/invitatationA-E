<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación A&E</title>
    <link rel="preconnect" href="https://anethyemiliano.my.canva.site" />
    <link rel="dns-prefetch" href="//anethyemiliano.my.canva.site" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loader">
      <div class="loader-background"></div>
      <div class="loader-content">
        <img src="img/loader.png" alt="Loading" class="loader-logo" />
        <div class="loader-shimmer"></div>
      </div>
    </div>
    <main class="page">
      <section class="invite-card" id="inviteCard">
        <picture>
          <source
            media="(orientation: portrait)"
            srcset="img/A&E0001.mobile.png"
          />

          <img src="img/A&E0001.png" alt="Invitación" class="invite-base" />
        </picture>
        <div class="overlay guest-name" id="guestName">
          Familia/Invitado xyz
        </div>
        <div class="overlay guest-count" id="guestCount">-1</div>
      </section>
    </main>
    <section class="detail-page" id="detailPage">
      <div class="detail-wrapper">
        <div class="detail-container">
          <img
            src="img/A&E0002.details.png"
            alt="Detalle Invitación"
            class="detail-image"
          />

          <!-- CEREMONIA -->
          <a
            class="hotspot hotspot-ceremony"
            href="https://maps.app.goo.gl/DtHbx18JfZQpNX43A"
            target="_blank"
            aria-label="Ver ubicación ceremonia"
          ></a>

          <!-- RECEPCION -->
          <a
            class="hotspot hotspot-reception"
            href="https://maps.app.goo.gl/HNxpxTARM386Vg9o8"
            target="_blank"
            aria-label="Ver ubicación recepción"
          ></a>
        </div>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sqids/0.3.0/sqids.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
